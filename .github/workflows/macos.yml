name: macOS
on: [push, pull_request]

jobs:
  macos:
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Rust tools
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Python test dependencies
        run: python3 -m venv /tmp/anscii-tests && /tmp/anscii-tests/bin/pip install -r requirements-dev.txt
      - name: Terminal playback (no audio device required)
        run: /tmp/anscii-tests/bin/python tests/terminal_smoke.py TerminalTests.test_play_pause_click_seek_color_resize_eof_and_quit -v
      - name: Large terminal and blocked output
        run: /tmp/anscii-tests/bin/python tests/large_terminal.py -v
      - name: Renderer benchmark
        run: target/release/anscii --benchmark --benchmark-size 640x192 | tee macos-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: macos-benchmark.txt
