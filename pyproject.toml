[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anscii"
version = "0.2.0"
description = "Compatibility launcher for the native Rust ASCII video player"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
anscii = "anscii:main"

[tool.setuptools]
py-modules = ["anscii"]
